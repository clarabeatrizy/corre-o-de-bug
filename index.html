<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorveteria Tropical</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #fffaf2;
      color: #333;
    }
    header {
      background: linear-gradient(45deg, #ff7b54, #ffb26b, #ffd56f);
      padding: 20px;
      text-align: center;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      margin-bottom: 5px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .banner {
      background: url('https://images.unsplash.com/photo-1629994902340-9f62a04d2e92?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }
    .banner h2 {
      font-size: 3rem;
      font-family: 'Pacifico', cursive;
    }
    .sabores {
      padding: 50px 20px;
      text-align: center;
    }
    .sabores h2 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #ff7b54;
    }
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card h3 {
      padding: 15px;
      font-size: 1.3rem;
      color: #333;
    }
    footer {
      background: linear-gradient(45deg, #ff7b54, #ffb26b, #ffd56f);
      text-align: center;
      padding: 20px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍦 Sorveteria Tropical</h1>
    <nav>
      <a href="#">Início</a>
      <a href="#sabores">Sabores</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <section class="banner">
    <h2>O sabor do verão está aqui!</h2>
  </section>

  <section class="sabores" id="sabores">
    <h2>Nossos Sabores</h2>
    <div class="card-container">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=800&q=80" alt="Sorvete de Morango">
        <h3>Morango Cremoso</h3>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1588854337112-1b8a5b929f2d?auto=format&fit=crop&w=800&q=80" alt="Sorvete de Chocolate">
        <h3>Chocolate Belga</h3>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=800&q=80" alt="Sorvete de Pistache">
        <h3>Pistache Tropical</h3>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1622015663312-6a76e7d85f1b?auto=format&fit=crop&w=800&q=80" alt="Sorvete de Manga">
        <h3>Manga Refrescante</h3>
      </div>
    </div>
  </section>

  <footer>
    © 2025 Sorveteria Tropical - Feito com 💖 e sabor
  </footer>

</body>
</html>
